  openRouletteScreenForMatch(true);
}

function openRouletteScreenForMatch(canTriggerSpin) {
  const prof = getOrCreateProfile();
  const oppLabel = gameState.mode === 'master' ? '鬼CPU'
    : gameState.mode === 'room_single' ? '部屋主CPU'
    : gameState.isOnline ? '通信相手' : 'CPU';

  const modeLbl = document.getElementById('roulette-mode-label');
  if (modeLbl) {
    modeLbl.textContent = gameState.mode === 'master' ? '👹 鬼レンチャレンジ（10連チャン）'
      : gameState.mode === 'room_single' ? `🏠 ルール部屋：${gameState.roomRule}`
      : gameState.isOnline ? '🌐 通信対戦（先押し側が抽選）' : '🎮 CPU対戦';
  }

  document.getElementById('roulette-spade-name').textContent = prof.nickname;
  document.getElementById('roulette-heart-name').textContent = oppLabel;
  document.getElementById('roulette-spade').classList.remove('active-spin');
  document.getElementById('roulette-heart').classList.remove('active-spin');

  const goBtn = document.getElementById('btn-roulette-go');
  const statusEl = document.getElementById('roulette-status-text');

  if (canTriggerSpin) {
    goBtn.style.display = 'inline-block';
    goBtn.disabled = false;
    statusEl.textContent = 'ボタンを押して席順を決定！';
  } else {
    goBtn.style.display = 'none';
    statusEl.textContent = '先押し側がルーレットを回しています...';
  }

  switchScreen('screen-roulette');
  // 先押しトリガーで通信入った場合は自動で回転開始
  if (gameState.isOnline && canTriggerSpin) {
    setTimeout(() => startRouletteSpin(true), 250);
  }
}

function startRouletteSpin(shouldSendResult) {
  const goBtn = document.getElementById('btn-roulette-go');
  if (goBtn) goBtn.disabled = true;
  const prof = getOrCreateProfile();
  const oppLabel = gameState.mode === 'master' ? '鬼CPU'
    : gameState.mode === 'room_single' ? '部屋主CPU'
    : gameState.isOnline ? '通信相手' : 'CPU';

  let step = 0;
  const timer = setInterval(() => {
    step++;
    SoundEngine.playRouletteTick();
    const sEl = document.getElementById('roulette-spade');
    const hEl = document.getElementById('roulette-heart');
    if (step % 2 === 0) {
      sEl.classList.add('active-spin');
      hEl.classList.remove('active-spin');
      document.getElementById('roulette-spade-name').textContent = prof.nickname;
      document.getElementById('roulette-heart-name').textContent = oppLabel;
    } else {
      hEl.classList.add('active-spin');
      sEl.classList.remove('active-spin');
      document.getElementById('roulette-spade-name').textContent = oppLabel;
      document.getElementById('roulette-heart-name').textContent = prof.nickname;
    }
    if (step >= 14) {
      clearInterval(timer);
      const youSpade = Math.random() < 0.5;
      const spadePlayer = youSpade ? 'YOU' : 'OPP';
      const heartPlayer = youSpade ? 'OPP' : 'YOU';
      applyRouletteOutcome(spadePlayer, heartPlayer, shouldSendResult);
    }
  }, 85);
}

function applyRouletteOutcome(spadePlayer, heartPlayer, shouldSendResult) {
  const prof = getOrCreateProfile();
  const oppLabel = gameState.mode === 'master' ? '鬼CPU'
    : gameState.mode === 'room_single' ? '部屋主CPU'
    : gameState.isOnline ? '通信相手' : 'CPU';

  gameState.spadePlayer = spadePlayer;
  gameState.heartPlayer = heartPlayer;

  document.getElementById('roulette-spade').classList.toggle('active-spin', spadePlayer === 'YOU');
  document.getElementById('roulette-heart').classList.toggle('active-spin', heartPlayer === 'YOU');
  document.getElementById('roulette-spade-name').textContent = spadePlayer === 'YOU' ? prof.nickname : oppLabel;
  document.getElementById('roulette-heart-name').textContent = heartPlayer === 'YOU' ? prof.nickname : oppLabel;

  const whoSpade = spadePlayer === 'YOU' ? prof.nickname : oppLabel;
  document.getElementById('roulette-status-text').textContent = `決定！ ♠先親：${whoSpade} → 対局開始！`;

  if (shouldSendResult && peerConn && peerConn.open) {
    peerConn.send({ type: 'ROULETTE_RESULT', spadePlayer, heartPlayer });
  }

  // 初期スコア・サイクルセットして開始
  gameState.cycle = 1;
  gameState.fieldSuit = '♠';
  gameState.streakCount = 0;
  gameState.playerScore = 30;
  gameState.cpuScore = 30;
  gameState.kyotaku = 0;
  gameState.isGameOver = false;

  setTimeout(() => {
    beginRoundWithSlideAndDeal(true);
  }, 750);
}

/* 「シュシュシュシュッ！」配札SE ＋ サイクルデカ表示スライドイン */
function playCycleSlideAndDeal(onDone) {
  if (isLaunchingSlideCycle) return;
  isLaunchingSlideCycle = true;

  const overlay = document.getElementById('cycle-slide-overlay');
  const logo = document.getElementById('cycle-slide-logo');
  const isOras = gameState.cycle >= 2;
  const cycleLabel = isOras
    ? `🔥 オーラスサイクル ${gameState.fieldSuit}場 🔥`
    : `第${gameState.cycle}サイクル ${gameState.fieldSuit}場`;

  logo.textContent = cycleLabel;
  logo.classList.toggle('oras', isOras);

  SoundEngine.playDealShushu();
  overlay.classList.add('active');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.classList.add('show');
    });
  });

  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => {
      overlay.classList.remove('active');
      isLaunchingSlideCycle = false;
      if (typeof onDone === 'function') onDone();
    }, 260);
  }, 980);
}

function createShuffledDeck53() {
  const cards = [];
  for (const s of SUITS) {
    for (let v = 1; v <= 13; v++) {
      cards.push({ suit: s, rank: NUM_TO_RANK[v], val: v, isJoker: false });
    }
  }
  cards.push({ suit: 'JOKER', rank: 'JKR', val: 0, isJoker: true });
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

function beginRoundWithSlideAndDeal(isFresh = false) {
  stopTurnTimer();
  if (isFresh) {
    gameState.cycle = 1;
    gameState.fieldSuit = '♠';
    gameState.streakCount = 0;
  }

  gameState.isPlayerParent = gameState.fieldSuit === '♠'
    ? gameState.spadePlayer === 'YOU'
    : gameState.heartPlayer === 'YOU';

  // 3・6・9連チャン供託（親の3の倍数連チャン目で子が2pt供託）
  if (gameState.streakCount > 0 && gameState.streakCount % 3 === 0) {
    if (gameState.isPlayerParent) {
      gameState.cpuScore -= 2;
      gameState.kyotaku += 2;
    } else {
      gameState.playerScore -= 2;
      gameState.kyotaku += 2;
    }
    SoundEngine.playLosePt();
  }

  const deck = createShuffledDeck53();
  const doraCount = gameState.cycle >= 2 ? 2 : 1;
  gameState.doraCards = [];
  gameState.uraDoraCards = [];
  for (let i = 0; i < doraCount; i++) {
    gameState.doraCards.push(deck.pop());
    gameState.uraDoraCards.push(deck.pop());
  }

  // 配牌：親5枚・子4枚
  gameState.playerHand = [];
  gameState.cpuHand = [];
  const pInit = gameState.isPlayerParent ? 5 : 4;
  const cInit = gameState.isPlayerParent ? 4 : 5;
  for (let i = 0; i < pInit; i++) gameState.playerHand.push(deck.pop());
  for (let i = 0; i < cInit; i++) gameState.cpuHand.push(deck.pop());
  gameState.deck = deck;

  gameState.playerRiver = [];
  gameState.cpuRiver = [];
  gameState.playerReachTiles = [];
  gameState.cpuReachTiles = [];
  gameState.selectedCardIdx = null;
  gameState.isPlayerReach = false;
  gameState.isDoubleReach = false;
  gameState.reachTurnIndex = -1;
  gameState.isPlayerIppatsu = false;
  gameState.cpuIsReach = false;
  gameState.cpuIsDoubleReach = false;
  gameState.cpuReachTurnIndex = -1;
  gameState.cpuIsIppatsu = false;
  gameState.turnCount = 0;
  gameState.playerFirstTurn = true;
  gameState.cpuFirstTurn = true;
  gameState.pendingRonCard = null;

  gameState.isPlayerTurn = gameState.isPlayerParent;
  gameState.hasDrawn = gameState.isPlayerParent;

  switchScreen('screen-game');
  renderSignalBar();
  updateGameUI();

  playCycleSlideAndDeal(() => {
    startTurnTimerIfNeeded();
    if (!gameState.isPlayerTurn && !gameState.isOnline) {
      setTimeout(() => runCpuStep(), 550);
    }
  });
}
</script>
<script>
function stopTurnTimer() {
  if (turnTimerId) {
    clearInterval(turnTimerId);
    turnTimerId = null;
  }
}

function startTurnTimerIfNeeded() {
  stopTurnTimer();
  const pill = document.getElementById('game-timer-pill');
  if (!gameState.is30sTimer) {
    if (pill) pill.classList.add('hidden');
    return;
  }
  remainSec = 30;
  if (pill) {
    pill.classList.remove('hidden');
    pill.textContent = `⏱ ${remainSec}s`;
  }
  turnTimerId = setInterval(() => {
    remainSec--;
    if (pill) pill.textContent = `⏱ ${remainSec}s`;
    if (remainSec <= 5 && remainSec > 0) SoundEngine.playWarnPip();
    if (remainSec <= 0) {
      stopTurnTimer();
      if (gameState.isPlayerTurn) {
        if (!gameState.hasDrawn) onPlayerDraw();
        else if (gameState.playerHand.length > 0) discardCardAt(gameState.playerHand.length - 1);
      }
    }
  }, 1000);
}

/* フリテン判定（自分が捨てた牌または同スートが河にあるか） */
function isFuritenCard(card) {
  if (!card || card.isJoker) return false;
  return gameState.playerRiver.some(d => {
    if (!d || d.isJoker) return false;
    return (d.suit === card.suit && d.val === card.val) || d.suit === card.suit;
  });
}

function onPlayerDraw() {
  if (!gameState.isPlayerTurn || gameState.hasDrawn || gameState.isGameOver) return;
  if (gameState.deck.length <= 0) {
    handleRyukyoku();
    return;
  }
  const card = gameState.deck.pop();
  gameState.playerHand.push(card);
  gameState.hasDrawn = true;
  gameState.selectedCardIdx = gameState.playerHand.length - 1;
  SoundEngine.playDraw();
  updateGameUI();
}

function onPlayerDiscardSelected() {
  if (!gameState.isPlayerTurn || !gameState.hasDrawn || gameState.isGameOver) return;
  const idx = gameState.selectedCardIdx !== null ? gameState.selectedCardIdx : gameState.playerHand.length - 1;
  if (idx < 0 || idx >= gameState.playerHand.length) return;
  discardCardAt(idx);
}

function discardCardAt(idx) {
  const card = gameState.playerHand.splice(idx, 1)[0];
  gameState.selectedCardIdx = null;
  gameState.hasDrawn = false;
  gameState.isPlayerTurn = false;
  gameState.playerRiver.push(card);
  SoundEngine.playDiscard();

  // 一発期限切れチェック（自分の次巡以降は一発終了）
  if (gameState.isPlayerReach && gameState.reachTurnIndex >= 0 && gameState.turnCount - gameState.reachTurnIndex > 1) {
    gameState.isPlayerIppatsu = false;
  }

  if (gameState.playerFirstTurn) gameState.playerFirstTurn = false;
  gameState.turnCount++;

  if (gameState.isOnline && peerConn && peerConn.open) {
    peerConn.send({
      type: 'DISCARD_SYNC',
      card,
      isReach: gameState.isPlayerReach,
      isDoubleReach: gameState.isDoubleReach
    });
  }

  updateGameUI();

  if (!gameState.isOnline) {
    setTimeout(() => runCpuStep(), 600);
  } else {
    startTurnTimerIfNeeded();
  }
}

function onPlayerDeclareReach() {
  if (!gameState.isPlayerTurn || !gameState.hasDrawn || gameState.isPlayerReach || gameState.isGameOver) return;
  if (gameState.roomRule === 'damaten') return alert('ダマテン部屋ではリーチ禁止です');

  // 4枚残しでテンパイか確認
  const idx = gameState.selectedCardIdx !== null ? gameState.selectedCardIdx : gameState.playerHand.length - 1;
  const rem4 = gameState.playerHand.filter((_, i) => i !== idx);
  const tRes = checkIsTenpai(rem4, gameState.seatSuit, { isReach: true, allowUnreachedBasic: true });
  if (!tRes.isTenpai) {
    return alert('選択牌を捨てたときテンパイ形（1枚で和了可能）になる必要があります');
  }

  // 供託1pt
  gameState.playerScore -= 1;
  gameState.kyotaku += 1;
  gameState.isPlayerReach = true;
  gameState.isDoubleReach = gameState.playerFirstTurn && gameState.turnCount === 0;
  gameState.reachTurnIndex = gameState.turnCount;
  gameState.isPlayerIppatsu = true;
  gameState.playerReachTiles = tRes.winningCards.filter(c => !c.isJoker).map(c => c.val);

  SoundEngine.playReach();
  discardCardAt(idx);
}

function onPlayerDeclareWin() {
  if (gameState.isGameOver) return;

  // ロン待ち中
  if (gameState.pendingRonCard) {
    const test5 = [...gameState.playerHand, gameState.pendingRonCard];
    if (isFuritenCard(gameState.pendingRonCard)) {
      return alert('フリテン状態のためロン和了できません');
    }
    const base = evaluateBaseHand(test5);
    if (!base) return;
    if (base.requireReach && !gameState.isPlayerReach) return alert('この役はリーチが必要です');
    if (gameState.roomRule === 'shiren' && base.baseScore <= 10 && !gameState.isPlayerReach) {
      return alert('試練の部屋では基本役はリーチ必須です');
    }
    const isIppatsu = gameState.isPlayerReach && (gameState.turnCount - gameState.reachTurnIndex <= 1);
    const scoreObj = calculateFinalScore(test5, {
      isReach: gameState.isPlayerReach,
      isDoubleReach: gameState.isDoubleReach,
      isIppatsu,
      isHaitei: false,
      isParent: gameState.isPlayerParent,
      seatSuit: gameState.seatSuit,
      doraCards: gameState.doraCards,
      uraDoraCards: gameState.uraDoraCards
    });
    gameState.playerHand.push(gameState.pendingRonCard);
    gameState.pendingRonCard = null;
    concludeRound('YOU', scoreObj, false, true);
    return;
  }

  // ツモ和了（5枚時）
  if (gameState.isPlayerTurn && gameState.playerHand.length === 5) {
    const base = evaluateBaseHand(gameState.playerHand);
    if (!base) return;
    if (base.requireReach && !gameState.isPlayerReach) return alert('この役はリーチが必要です');
    if (gameState.roomRule === 'shiren' && base.baseScore <= 10 && !gameState.isPlayerReach) {
      return alert('試練の部屋では基本役はリーチ必須です');
    }
    const isIppatsu = gameState.isPlayerReach && (gameState.turnCount - gameState.reachTurnIndex <= 1);
    const isHaitei = gameState.deck.length === 0;
    const isTenhou = gameState.turnCount === 0 && gameState.playerFirstTurn;
    const scoreObj = calculateFinalScore(gameState.playerHand, {
      isReach: gameState.isPlayerReach,
      isDoubleReach: gameState.isDoubleReach,
      isIppatsu,
      isHaitei,
      isTenhou,
      isParent: gameState.isPlayerParent,
      seatSuit: gameState.seatSuit,
      doraCards: gameState.doraCards,
      uraDoraCards: gameState.uraDoraCards
    });
    concludeRound('YOU', scoreObj, true, true);
  }
}

function onRemoteDiscard(card, oppReach, oppDoubleReach) {
  gameState.cpuRiver.push(card);
  gameState.cpuIsReach = Boolean(oppReach);
  gameState.cpuIsDoubleReach = Boolean(oppDoubleReach);
  SoundEngine.playDiscard();

  // ロンチャンス確認
  if (gameState.playerHand.length === 4 && !isFuritenCard(card)) {
    const base = evaluateBaseHand([...gameState.playerHand, card]);
    if (base && (!base.requireReach || gameState.isPlayerReach)) {
      gameState.pendingRonCard = card;
      updateGameUI();
      return;
    }
  }

  gameState.isPlayerTurn = true;
  gameState.hasDrawn = false;
  updateGameUI();
  startTurnTimerIfNeeded();
}

/* CPU思考（ラリーSE＋一定の間をおいて進行） */
function runCpuStep() {
  if (gameState.isGameOver || gameState.isPlayerTurn) return;
  SoundEngine.playRally();

  if (gameState.cpuHand.length < 5) {
    if (gameState.deck.length <= 0) {
      handleRyukyoku();
      return;
    }
    gameState.cpuHand.push(gameState.deck.pop());
  }

  // CPUツモ和了チェック
  if (gameState.cpuHand.length === 5) {
    const cBase = evaluateBaseHand(gameState.cpuHand);
    if (cBase) {
      const canWin = gameState.mode === 'beginner'
        ? (cBase.baseScore <= 10 && gameState.cpuIsReach)
        : (!cBase.requireReach || gameState.cpuIsReach);
      if (canWin) {
        const isIppatsu = gameState.cpuIsReach && (gameState.turnCount - gameState.cpuReachTurnIndex <= 1);
        const sObj = calculateFinalScore(gameState.cpuHand, {
          isReach: gameState.cpuIsReach,
          isDoubleReach: gameState.cpuIsDoubleReach,
          isIppatsu,
          isHaitei: gameState.deck.length === 0,
          isParent: !gameState.isPlayerParent,
          seatSuit: gameState.seatSuit === '♠' ? '♥' : '♠',
          doraCards: gameState.doraCards,
          uraDoraCards: gameState.uraDoraCards
        });
        concludeRound('OPP', sObj, true, true);
        return;
      }
    }
  }

  // CPUリーチ判断
  if (!gameState.cpuIsReach && gameState.cpuHand.length === 5 && gameState.roomRule !== 'damaten') {
    const shouldReach = gameState.mode === 'master' ? Math.random() < 0.55
      : gameState.mode === 'main' ? Math.random() < 0.25
      : Math.random() < 0.35;
    if (shouldReach) {
      for (let i = 0; i < gameState.cpuHand.length; i++) {
        const rem4 = gameState.cpuHand.filter((_, idx) => idx !== i);
        const t = checkIsTenpai(rem4, gameState.seatSuit === '♠' ? '♥' : '♠', { isReach: true, allowUnreachedBasic: true });
        if (t.isTenpai) {
          gameState.cpuScore -= 1;
          gameState.kyotaku += 1;
          gameState.cpuIsReach = true;
          gameState.cpuIsDoubleReach = gameState.cpuFirstTurn && gameState.turnCount === 0;
          gameState.cpuReachTurnIndex = gameState.turnCount;
          gameState.cpuIsIppatsu = true;
          SoundEngine.playReach();
          break;
        }
      }
    }
  }

  // 1枚打牌
  const dropIdx = gameState.cpuHand.length > 0 ? Math.floor(Math.random() * gameState.cpuHand.length) : 0;
  const dropped = gameState.cpuHand.splice(dropIdx, 1)[0];
  gameState.cpuRiver.push(dropped);
  if (gameState.cpuFirstTurn) gameState.cpuFirstTurn = false;
  gameState.turnCount++;
  SoundEngine.playDiscard();

  // プレイヤーのロン判定
  if (gameState.playerHand.length === 4 && !isFuritenCard(dropped)) {
    const pBase = evaluateBaseHand([...gameState.playerHand, dropped]);
    if (pBase && (!pBase.requireReach || gameState.isPlayerReach)) {
      if (!(gameState.roomRule === 'shiren' && pBase.baseScore <= 10 && !gameState.isPlayerReach)) {
        gameState.pendingRonCard = dropped;
        updateGameUI();
        return;
      }
    }
  }

  gameState.isPlayerTurn = true;
  gameState.hasDrawn = false;
  updateGameUI();
  startTurnTimerIfNeeded();
}

/* 和了精算・サイクル＆鬼レンチャレンジ判定 */
function concludeRound(winnerSide, scoreObj, isTsumo, shouldBroadcast) {
  stopTurnTimer();
  const pts = (scoreObj ? scoreObj.totalScore : 5) + gameState.kyotaku;
  gameState.kyotaku = 0;

  if (winnerSide === 'YOU') {
    gameState.playerScore += pts;
    gameState.cpuScore -= pts;
    SoundEngine.playWin(scoreObj ? scoreObj.totalScore : 10);
  } else {
    gameState.cpuScore += pts;
    gameState.playerScore -= pts;
    SoundEngine.playLosePt();
  }

  if (shouldBroadcast && gameState.isOnline && peerConn && peerConn.open) {
    peerConn.send({ type: 'ROUND_WIN_SYNC', winnerSide, scoreObj, isTsumo });
  }

  // 親権・連チャン・サイクル進行
  const winnerIsParent = (winnerSide === 'YOU' && gameState.isPlayerParent) || (winnerSide === 'OPP' && !gameState.isPlayerParent);
  if (winnerIsParent) {
    if (winnerSide === 'YOU') gameState.streakCount++;
    else gameState.streakCount = 0;
  } else {
    gameState.streakCount = 0;
    advanceFieldAndCycle();
  }

  // 鬼レンチャレンジ（10連チャン達成 or 第2サイクルオーラス親権消滅で終了）
  if (gameState.mode === 'master') {
    if (gameState.streakCount >= 10) {
      gameState.isGameOver = true;
      showResultScreen({
        title: '🎉 10連チャン完全制覇！ 🎉',
        sub: '鬼レンチャレンジ達成おめでとうございます！',
        breakdown: scoreObj ? scoreObj.breakdown : [],
        winnerSide,
        pts,
        isOnirenClear: true
      });
      return;
    }
    if (gameState.isGameOver) {
      showResultScreen({
        title: '💀 鬼レンチャレンジ終了 💀',
        sub: '第2サイクルオーラス親権消滅のため終了',
        breakdown: scoreObj ? scoreObj.breakdown : [],
        winnerSide,
        pts,
        isOnirenFail: true
      });
      return;
    }
  }

  if (gameState.isGameOver) {
    const winLabel = gameState.playerScore >= gameState.cpuScore ? '🏆 あなたの勝利！' : '💥 相手の勝利…';
    showResultScreen({
      title: `${winLabel}（お疲れ様でした）`,
      sub: `最終スコア あなた ${gameState.playerScore}pt / 相手 ${gameState.cpuScore}pt`,
      breakdown: scoreObj ? scoreObj.breakdown : [],
      winnerSide,
      pts
    });
    return;
  }

  showResultScreen({
    title: winnerSide === 'YOU' ? `🎉 和了（+${pts}pt）！` : `⚡ 相手和了（-${pts}pt）`,
    sub: `${isTsumo ? 'ツモ' : 'ロン'}：${scoreObj ? scoreObj.yakuName : '役'}`,
    breakdown: scoreObj ? scoreObj.breakdown : [],
    winnerSide,
    pts
  });
}

function handleRyukyoku() {
  stopTurnTimer();
  // ノーテン罰符（各1pt）
  const pTen = checkIsTenpai(gameState.playerHand.slice(0, 4), gameState.seatSuit, { allowUnreachedBasic: true }).isTenpai;
  const cTen = checkIsTenpai(gameState.cpuHand.slice(0, 4), gameState.seatSuit === '♠' ? '♥' : '♠', { allowUnreachedBasic: true }).isTenpai;
  if (!pTen) { gameState.playerScore -= 1; gameState.kyotaku += 1; }
  if (!cTen) { gameState.cpuScore -= 1; gameState.kyotaku += 1; }

  const parentTen = gameState.isPlayerParent ? pTen : cTen;
  if (!parentTen) {
    gameState.streakCount = 0;
    advanceFieldAndCycle();
  }

  if (gameState.isGameOver) {
    showResultScreen({
      title: '🏁 オーラス終了（お疲れ様でした）',
      sub: `最終スコア あなた ${gameState.playerScore}pt / 相手 ${gameState.cpuScore}pt`,
      breakdown: ['流局精算完了'],
      winnerSide: null,
      pts: 0
    });
    return;
  }

  showResultScreen({
    title: '⚖️ 流局',
    sub: parentTen ? '親テンパイにつき連荘・親維持' : '親ノーテンにつき親流れ',
    breakdown: [`あなたテンパイ: ${pTen ? 'あり' : 'なし'} / 相手: ${cTen ? 'あり' : 'なし'}`],
    winnerSide: null,
    pts: 0
  });
}

function advanceFieldAndCycle() {
  if (gameState.fieldSuit === '♠') {
    gameState.fieldSuit = '♥';
  } else {
    gameState.fieldSuit = '♠';
    gameState.cycle += 1;
    if (gameState.cycle > 2) {
      gameState.isGameOver = true;
    }
  }
}

function showResultScreen(info) {
  const badgeBox = document.getElementById('result-oniren-badge');
  if (badgeBox) {
    if (gameState.mode === 'master' && gameState.streakCount >= 2) {
      badgeBox.innerHTML = `<div class="oniren-badge">🔥 ${gameState.streakCount}連チャン達成！ 🔥</div>`;
    } else {
      badgeBox.innerHTML = '';
    }
  }
  document.getElementById('result-headline').textContent = info.title;
  document.getElementById('result-subline').textContent = info.sub;
  const det = document.getElementById('result-detail-box');
  det.innerHTML = `
    <div>現在スコア：あなた <b>${gameState.playerScore}pt</b> ／ 相手 <b>${gameState.cpuScore}pt</b></div>
    <div>サイクル：第${gameState.cycle}サイクル ${gameState.fieldSuit}場 ／ 連チャン：${gameState.streakCount}</div>
    <div style="color:#ffd700;">${(info.breakdown || []).map(b => `・${escapeHtml(b)}`).join('<br>')}</div>
  `;
  const nextBtn = document.getElementById('btn-result-next');
  if (nextBtn) {
    nextBtn.textContent = gameState.isGameOver ? 'もう一度対戦する' : '次の局へ';
  }
  switchScreen('screen-result');
}

function onResultNextAction() {
  SoundEngine.playTap();
  if (gameState.isGameOver) {
    gameState.cycle = 1;
    gameState.fieldSuit = '♠';
    gameState.streakCount = 0;
    gameState.playerScore = 30;
    gameState.cpuScore = 30;
    gameState.kyotaku = 0;
    gameState.isGameOver = false;
    beginRoundWithSlideAndDeal(true);
  } else {
    beginRoundWithSlideAndDeal(false);
  }
}

/* 吹き出しシグナルバー＆UI描画 */
function renderSignalBar() {
  const bar = document.getElementById('signal-bar');
  if (!bar) return;
  const show = gameState.isOnline || gameState.mode === 'room_single';
  bar.style.display = show ? 'flex' : 'none';
  if (!show) return;

  const customList = getCustomBubbles().filter(Boolean);
  const allMsgs = [...DEFAULT_BUBBLE_TEMPLATES, ...customList];
  bar.innerHTML = '';

  allMsgs.forEach(msg => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'signal-chip';
    chip.textContent = msg;
    chip.onclick = () => {
      gameState.playerBubbleText = msg;
      gameState.playerBubbleHidden = false;
      SoundEngine.playBubbleUpdate();
      if (gameState.isOnline && peerConn && peerConn.open) {
        peerConn.send({ type: 'BUBBLE_UPDATE', text: msg, hidden: false });
      }
      updateGameUI();
    };
    bar.appendChild(chip);
  });

  const hideChip = document.createElement('button');
  hideChip.type = 'button';
  hideChip.className = 'signal-chip';
  hideChip.textContent = '非表示';
  hideChip.onclick = () => {
    gameState.playerBubbleHidden = true;
    SoundEngine.playBubbleUpdate();
    if (gameState.isOnline && peerConn && peerConn.open) {
      peerConn.send({ type: 'BUBBLE_UPDATE', text: gameState.playerBubbleText, hidden: true });
    }
    updateGameUI();
  };
  bar.appendChild(hideChip);
}

function renderMiniCard(card, extraClass = '') {
  if (!card) return '<span class="mini-card">?</span>';
  if (card.isJoker) return `<span class="mini-card joker ${extraClass}">JKR</span>`;
  const isRed = card.suit === '♥' || card.suit === '♦';
  return `<span class="mini-card ${isRed ? 'red' : ''} ${extraClass}"><span>${card.suit}</span><span>${card.rank}</span></span>`;
}

function renderHandCard(card, idx, isWinMark = false) {
  const div = document.createElement('div');
  const selected = gameState.selectedCardIdx === idx;
  const locked = gameState.isPlayerReach;
  if (card.isJoker) {
    div.className = `jp-card joker-card ${selected ? 'selected' : ''} ${locked ? 'locked' : ''} ${isWinMark ? 'win-tile-mark' : ''}`;
    div.innerHTML = `${isWinMark ? '<span class="win-corner-badge">和了</span>' : ''}<div class="jp-joker-diag-text">JOKER</div>`;
  } else {
    const isRed = card.suit === '♥' || card.suit === '♦';
    div.className = `jp-card ${isRed ? 'red-suit' : ''} ${selected ? 'selected' : ''} ${locked ? 'locked' : ''} ${isWinMark ? 'win-tile-mark' : ''}`;
    div.innerHTML = `
      ${isWinMark ? '<span class="win-corner-badge">和了</span>' : ''}
      <div class="jp-card-top">${card.suit}${card.rank}</div>
      <div class="jp-card-diag">
        <span class="jp-card-suit-big">${card.suit}</span>
        <span class="jp-card-rank-big">${card.rank}</span>
      </div>
      <div class="jp-card-bot">${card.suit}${card.rank}</div>
    `;
  }
  div.onclick = () => {
    if (!gameState.isPlayerTurn || !gameState.hasDrawn || gameState.isGameOver) return;
    SoundEngine.playTap();
    gameState.selectedCardIdx = idx;
    updateGameUI();
  };
  return div;
}

function updateGameUI() {
  const prof = getOrCreateProfile();
  const modeBadge = document.getElementById('game-mode-badge');
  if (modeBadge) {
    modeBadge.textContent = gameState.mode === 'master' ? '👹 鬼レン'
      : gameState.mode === 'room_single' ? `🏠 ${gameState.roomRule}`
      : gameState.isOnline ? '🌐 通信戦'
      : gameState.mode === 'main' ? '⚔️ メイン' : '🌱 ビギナー';
  }

  // 相手手札裏面・河
  const oppRow = document.getElementById('opp-hand-row');
  if (oppRow) {
    oppRow.innerHTML = '';
    const cnt = Math.max(0, Math.min(5, gameState.cpuHand.length));
    for (let i = 0; i < cnt; i++) {
      const b = document.createElement('div');
      b.className = 'card-back';
      oppRow.appendChild(b);
    }
  }

  const oppRiv = document.getElementById('opp-river-box');
  if (oppRiv) oppRiv.innerHTML = gameState.cpuRiver.map(c => renderMiniCard(c)).join('');

  const selfRiv = document.getElementById('self-river-box');
  if (selfRiv) selfRiv.innerHTML = gameState.playerRiver.map(c => renderMiniCard(c)).join('');

  // 中央ステータスボード
  const cycleLbl = gameState.cycle >= 2
    ? `第2サイクル(オーラス) ${gameState.fieldSuit}場`
    : `第1サイクル ${gameState.fieldSuit}場`;
  document.getElementById('board-cycle-info').textContent = cycleLbl;
  document.getElementById('board-streak-info').textContent = `${gameState.streakCount}連チャン`;
  document.getElementById('board-turn-info').textContent = gameState.isPlayerTurn ? 'あなたの番' : '相手思考中';

  const youIsSpade = gameState.spadePlayer === 'YOU';
  const sScore = youIsSpade ? gameState.playerScore : gameState.cpuScore;
  const hScore = youIsSpade ? gameState.cpuScore : gameState.playerScore;
  document.getElementById('spade-score-label').textContent = `♠ ${sScore}pt`;
  document.getElementById('heart-score-label').textContent = `♥ ${hScore}pt`;

  const doraRow = document.getElementById('dora-mini-row');
  if (doraRow) {
    doraRow.innerHTML = gameState.doraCards.map(d => renderMiniCard(d)).join('');
  }

  document.getElementById('board-kyotaku-info').textContent = `供託: ${gameState.kyotaku}pt`;
  document.getElementById('board-deck-info').textContent = `山札: ${gameState.deck.length}枚`;

  document.getElementById('opp-name-seat').textContent = `${gameState.isPlayerParent ? '子' : '親'}：相手`;
  document.getElementById('self-name-seat').textContent = `${gameState.isPlayerParent ? '親' : '子'}：${prof.nickname}`;
  document.getElementById('opp-reach-tag').textContent = gameState.cpuIsReach ? '⚡ リーチ中' : '';

  // 上下固定吹き出し
  const oppBub = document.getElementById('opp-bubble-box');
  const selfBub = document.getElementById('self-bubble-box');
  const showBub = gameState.isOnline || gameState.mode === 'room_single';
  if (oppBub) {
    if (showBub && !gameState.oppBubbleHidden && gameState.oppBubbleText) {
      oppBub.classList.remove('hidden');
      oppBub.textContent = `💬 ${gameState.oppBubbleText}`;
    } else {
      oppBub.classList.add('hidden');
    }
  }
  if (selfBub) {
    if (showBub && !gameState.playerBubbleHidden && gameState.playerBubbleText) {
      selfBub.classList.remove('hidden');
      selfBub.textContent = `💬 ${gameState.playerBubbleText}`;
    } else {
      selfBub.classList.add('hidden');
    }
  }

  // 5枠固定手札グリッド
  const handArea = document.getElementById('player-hand-area');
  if (handArea) {
    handArea.innerHTML = '';
    for (let slot = 0; slot < 5; slot++) {
      const slotDiv = document.createElement('div');
      slotDiv.className = 'hand-slot';
      const card = gameState.playerHand[slot];
      if (card) {
        const isWin = Boolean(gameState.pendingRonCard && gameState.playerHand.length === 4);
        slotDiv.appendChild(renderHandCard(card, slot, isWin));
      } else {
        const emp = document.createElement('div');
        emp.className = 'hand-slot-empty';
        slotDiv.appendChild(emp);
      }
      handArea.appendChild(slotDiv);
    }
  }

  // 役プレビュー＆ボタン活性制御
  const previewEl = document.getElementById('self-yaku-preview');
  let canWinNow = false;
  if (gameState.pendingRonCard) {
    const b = evaluateBaseHand([...gameState.playerHand, gameState.pendingRonCard]);
    if (b && !isFuritenCard(gameState.pendingRonCard) && (!b.requireReach || gameState.isPlayerReach)) {
      canWinNow = true;
      if (previewEl) previewEl.textContent = `ロン可能：${b.name} (${b.baseScore}pt)`;
    }
  } else if (gameState.playerHand.length === 5) {
    const b = evaluateBaseHand(gameState.playerHand);
    if (b && (!b.requireReach || gameState.isPlayerReach)) {
      canWinNow = true;
      if (previewEl) previewEl.textContent = `ツモ可能：${b.name} (${b.baseScore}pt)`;
    } else if (b && b.requireReach && !gameState.isPlayerReach) {
      if (previewEl) previewEl.textContent = `${b.name}（要リーチ）`;
    } else if (previewEl) {
      previewEl.textContent = '';
    }
  } else if (previewEl) {
    previewEl.textContent = '';
  }

  const drawBtn = document.getElementById('btn-action-draw');
  const discBtn = document.getElementById('btn-action-discard');
  const reachBtn = document.getElementById('btn-action-reach');
  const winBtn = document.getElementById('btn-action-win');

  if (drawBtn) drawBtn.disabled = !gameState.isPlayerTurn || gameState.hasDrawn || gameState.isGameOver;
  if (discBtn) discBtn.disabled = !gameState.isPlayerTurn || !gameState.hasDrawn || gameState.isGameOver;
  if (reachBtn) reachBtn.disabled = !gameState.isPlayerTurn || !gameState.hasDrawn || gameState.isPlayerReach || gameState.roomRule === 'damaten' || gameState.isGameOver;
  if (winBtn) {
    winBtn.disabled = !canWinNow || gameState.isGameOver;
    winBtn.classList.toggle('win-glow', canWinNow && !gameState.isGameOver);
  }
}

/* URLクエリ（?room=...）自動セット＆初期画面 */
window.addEventListener('DOMContentLoaded', () => {
  getOrCreateProfile();
  try {
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get('room');
    if (roomParam) {
      showOnlineLobby();
      const inp = document.getElementById('lobby-join-id-input');
      if (inp) inp.value = roomParam;
    }
  } catch (e) {}
});
