<title>２人打ち ジャンポーカー 〜ジャンP２〜</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  background-color: #091315; color: #f5f6fa;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden;

#game-wrapper {
  width: 100%; max-width: 440px; height: 100%; max-height: 950px;

  box-shadow: 0 0 20px rgba(0,0,0,0.9); overflow: hidden; font-size: 1.05rem;
}
.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; background: #102023; z-index: 1; }
.screen.active { display: flex; z-index: 10; }

  background: linear-gradient(135deg, #f1c40f, #d4ac0d);
  color: #091315; border: none; border-radius: 6px; font-weight: 900;
  cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform 0.08s ease;
}
.btn-gold:active:not(:disabled) { transform: scale(0.97); }
.btn-gold:disabled { opacity: 0.55; cursor: not-allowed; }

.card-tile {
  background: #fdfdfd; color: #111; border-radius: 5px; border: 1.5px solid #cbd5e1;

}
.card-tile.red { color: #d63031; }
.card-tile.selected { transform: translateY(-6px); border-color: #f1c40f; box-shadow: 0 0 10px rgba(241,196,15,0.85); }
.card-tile.reach-tile { border-color: #ff3838 !important; box-shadow: 0 0 8px rgba(255,56,56,0.9); }

.cat-panel-btn {

.cat-1 { background: #16a085; }
.cat-2 { background: #2980b9; }
.cat-3 { background: #8e44ad; }
.cat-4 { background: #c0392b; }

<script>
const SoundEngine = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  },
  playTone(freq, duration, type = 'sine', gainVal = 0.15) {
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  },
  playSE(type) {
    if (type === 'select_card') this.playTone(660, 0.06, 'sine', 0.1);
    else if (type === 'draw_card') this.playTone(520, 0.08, 'triangle', 0.12);
    else if (type === 'discard_card') this.playTone(340, 0.08, 'triangle', 0.12);
    else if (type === 'reach_declare') {
      this.playTone(784, 0.1, 'square', 0.14);
      setTimeout(() => this.playTone(1046, 0.14, 'square', 0.14), 80);
    } else if (type === 'reach_slash') {
      this.playTone(1318, 0.09, 'sine', 0.18);
      setTimeout(() => this.playTone(1760, 0.16, 'triangle', 0.16), 70);
    } else if (type === 'ippatsu_shout') {
      [587, 880, 1174, 1567].forEach((f, i) => setTimeout(() => this.playTone(f, 0.28, 'sawtooth', 0.25), i * 75));
    } else if (type === 'win_basic') {
      [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.playTone(f, 0.2, 'triangle', 0.2), i * 90));
    } else if (type === 'win_mid') {
      [523, 659, 783, 1046, 1318].forEach((f, i) => setTimeout(() => this.playTone(f, 0.22, 'sawtooth', 0.22), i * 85));
    } else if (type === 'win_yakuman') {
      [392, 523, 659, 783, 1046, 1567].forEach((f, i) => setTimeout(() => this.playTone(f, 0.32, 'square', 0.25), i * 110));
    } else if (type === 'win_joker') {
      [587, 739, 880, 1174, 1480, 1760].forEach((f, i) => setTimeout(() => this.playTone(f, 0.25, 'sine', 0.28), i * 95));
    } else if (type === 'lose_basic') {
      this.playTone(280, 0.25, 'sawtooth', 0.2);
      setTimeout(() => this.playTone(180, 0.35, 'sawtooth', 0.2), 120);
    } else if (type === 'lose_heavy') {
      this.playTone(160, 0.5, 'sawtooth', 0.28);
      setTimeout(() => this.playTone(100, 0.7, 'sawtooth', 0.3), 150);
    } else if (type === 'roulette_spin') {
      this.playTone(920, 0.04, 'triangle', 0.1);
    } else if (type === 'timer_warning_pip') {
      this.playTone(1200, 0.08, 'square', 0.16);
    } else if (type === 'timer_warning_bone') {
      this.playTone(220, 0.25, 'sawtooth', 0.22);
    }
  }
};

function checkValidStraight(vals, numJokers) {
  if (vals.length + numJokers !== 5 && vals.length + numJokers !== 3) return false;
  const targetLen = vals.length + numJokers;
  const uniqueVals = [...new Set(vals)];
  if (uniqueVals.length !== vals.length) return false;
  for (let minV = 2; minV <= 15 - targetLen; minV++) {
    let target = [];
    for (let k = 0; k < targetLen; k++) target.push(minV + k);
    if (matchesTemplate(vals, target, numJokers)) return true;
  }
  if (targetLen === 5 && matchesTemplate(vals, [14, 2, 3, 4, 5], numJokers)) return true;
  if (targetLen === 3 && matchesTemplate(vals, [14, 2, 3], numJokers)) return true;
  return false;
}

function matchesTemplate(vals, target, numJokers) {
  let missing = 0;
  for (let t of target) if (!vals.includes(t)) missing++;
  return missing === numJokers;
}

function hasValsSet(vals, numJokers, targetArr) {
  let tempVals = [...vals], jCnt = numJokers;
  for (let t of targetArr) {
    let idx = tempVals.indexOf(t);
    if (idx !== -1) tempVals.splice(idx, 1);
    else jCnt--;
  }
  return jCnt >= 0 && tempVals.length === 0;
}

function evaluateHand5(cards, options = {}) {
  const {
    ignoreReachRequirement = false,
    reachActive = (gameState.isPlayerReach || gameState.cpuIsReach),
    allowTenchi = true
  } = options;

  if (!cards || cards.length !== 5) return null;
  const sorted = [...cards].sort((a, b) => a.val - b.val);
  const jokers = sorted.filter(c => c.isJoker);
  const normals = sorted.filter(c => !c.isJoker);
  const suits = normals.map(c => c.suit);
  const vals = normals.map(c => c.val);
  const uniqueSuits = [...new Set(suits)];

  for (let yaku of YAKU_REGISTRY) {
    if (yaku.catId === 1) continue;
    if (jokers.length > 0 && yaku.jokerType === 'forbidden') continue;
    if (jokers.length === 0 && yaku.jokerType === 'required') continue;
    if (gameState.isOnline && gameState.roomRule === 'shiren' && yaku.catId !== 2) continue;

    try {
      if (yaku.check(cards, jokers, normals, vals, suits, uniqueSuits)) {
        if (!ignoreReachRequirement && yaku.requireReach && !reachActive) continue;
        if (allowTenchi && gameState.turnCount === 0) {
          return {
            name: "天地人和 ＆ " + yaku.name,
            score: 5 + yaku.score,
            jokerType: yaku.jokerType,
            requireReach: false,
            desc: "天地人和（+5pt） ＋ " + yaku.name + " (" + yaku.score + "pt)",
            baseYaku: yaku
          };
        }
        return yaku;
      }
    } catch (e) {}
  }
  return null;
}

function getBestYakuWithTenchi(cards, ignoreReachRequirement = false) {
  return evaluateHand5(cards, { ignoreReachRequirement, allowTenchi: true });
}

function evaluateRonHand(hand4, winTile, reachActive = gameState.isPlayerReach) {
  if (!hand4 || hand4.length !== 4 || !winTile) return null;
  const testCards = [...hand4, winTile];
  const evaluated = evaluateHand5(testCards, { ignoreReachRequirement: false, reachActive, allowTenchi: false });
  if (!evaluated) return null;
  if (winTile.isJoker && evaluated.jokerType !== 'required') return null;
  return evaluated;
}

function checkIsTenpai(hand4, reachActive = true) {
  if (!hand4 || hand4.length !== 4) return false;
  const testPool = [];
  ['♠', '♥', '♦', '♣'].forEach(s => {
    for (let v = 2; v <= 14; v++) testPool.push({ suit: s, val: v, isJoker: false });
  });
  testPool.push({ suit: '', val: 0, isJoker: true });
  for (let candidate of testPool) {
    if (evaluateHand5([...hand4, candidate], { ignoreReachRequirement: !reachActive, reachActive, allowTenchi: false })) {
      return true;
    }
  }
  return false;
}

function checkPlayerFuritenForRon(hand4, targetRonTile) {
  if (!hand4 || hand4.length !== 4 || !targetRonTile || gameState.playerRiver.length === 0) return false;
  for (let riverCard of gameState.playerRiver) {
    if (riverCard.isJoker && targetRonTile.isJoker) return true;
    if (!riverCard.isJoker && !targetRonTile.isJoker && riverCard.val === targetRonTile.val && riverCard.suit === targetRonTile.suit) return true;
  }
  return false;
}

function countDoraHits(hand, doraList) {
  let hits = 0;
  hand.forEach(card => {
    if (card.isJoker) return;
    doraList.forEach(dora => {
      if (dora && !dora.isJoker && card.val === (dora.val === 14 ? 2 : dora.val + 1)) hits++;
    });
  });
  return hits;
}

function countSuitDoraHits(mySuit, doraList) {
  let count = 0;
  doraList.forEach(dora => {
    if (dora && !dora.isJoker && dora.suit === mySuit) count++;
  });
  return count;
}

  mode: 'beginner', roomRule: 'shoushi', isOnline: false, isHost: true,
  cycle: 1, fieldSuit: '♠', streakCount: 0, isPlayerParent: true,
  spadePlayer: 'YOU', heartPlayer: '相手',
  playerScore: 30, cpuScore: 30, kyotaku: 0,
  deck: [], doraCards: [], uraDoraCards: [],
  playerHand: [], cpuHand: [], playerRiver: [], cpuRiver: [],
  selectedCardIdx: null, hasDrawn: false,
  isPlayerReach: false, isPlayerReachPending: false, isDoubleReach: false,
  cpuIsReach: false, cpuIsDoubleReach: false,
  turnCount: 0,
  playerReachTurnIndex: -1, cpuReachTurnIndex: -1,
  playerReachTileIndex: null, cpuReachTileIndex: null,
  isColdWinTriggered: false, isGameOver: false
};

/**
 * 一発判定の一元化（リーチ宣言直後の1巡以内限定）
 * - reachTurnIndex >= 0 かつ turnCount - reachTurnIndex <= 1 のみ有効
 */
function checkIsIppatsu(actor) {
  if (actor === 'player') {
    if (!gameState.isPlayerReach || gameState.playerReachTurnIndex < 0) return false;
    return (gameState.turnCount - gameState.playerReachTurnIndex) <= 1;
  } else {
    if (!gameState.cpuIsReach || gameState.cpuReachTurnIndex < 0) return false;
    return (gameState.turnCount - gameState.cpuReachTurnIndex) <= 1;
  }
}

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(screenId);
  if (target) target.classList.add('active');
}

function showTitle() {
  clearInterval(turnTimer); clearInterval(resTimer); clearInterval(rematchTimer);
  switchScreen('screen-title');
}

function showModeSelect() {
  gameState.isOnline = false;
  gameState.roomRule = 'shoushi';
  gameState.spadePlayer = 'YOU';
  gameState.heartPlayer = '相手';
  switchScreen('screen-mode');
}

function selectCpuMode(mode) {
  gameState.mode = mode;
  gameState.isOnline = false;
  gameState.playerScore = 30;
  gameState.cpuScore = 30;
  gameState.streakCount = 0;
  gameState.kyotaku = 0;
  gameState.cycle = 1;
  gameState.fieldSuit = '♠';
  gameState.isGameOver = false;
  switchScreen('screen-roulette');
  document.getElementById('roulette-warning-banner').style.display = 'block';
  document.getElementById('btn-cpu-spin').style.display = 'inline-block';
  document.getElementById('btn-online-game-start').style.display = 'none';
  document.getElementById('roulette-wait-msg').style.display = 'none';
  document.getElementById('roulette-result-text').innerText = 'ルーレットボタンを押してください';
}

function showOnlineLobby() {
  gameState.isOnline = true;
  switchScreen('screen-online');
}

function startRoomMatch(roomRule) {
  SoundEngine.playSE('select_card');
  gameState.isOnline = true;
  gameState.mode = 'beginner';
  gameState.roomRule = roomRule;
  gameState.playerScore = 30;
  gameState.cpuScore = 30;
  gameState.streakCount = 0;
  gameState.kyotaku = 0;
  gameState.cycle = 1;
  gameState.fieldSuit = '♠';
  gameState.isGameOver = false;
  let roomName = roomRule === 'shiren' ? '🔥 試練の部屋' : roomRule === 'damaten' ? '🧠 ダマテン部屋' : '⚔️ 勝負師の部屋';
  document.getElementById('online-status-msg').innerText = `✨ ${roomName} に入室中...`;
  setTimeout(() => {
    switchScreen('screen-roulette');
    document.getElementById('roulette-warning-banner').style.display = 'block';
    document.getElementById('btn-cpu-spin').style.display = 'none';
    spinCpuRoulette();
  }, 500);
}

function spinCpuRoulette() {
  document.getElementById('btn-cpu-spin').disabled = true;
  let count = 0;
  const suits = ['♠', '♥'];
  const suitEl = document.getElementById('roulette-suit');
  const timer = setInterval(() => {
    const s = suits[count % 2];
    suitEl.innerText = s;
    suitEl.style.color = s === '♠' ? '#3498db' : '#e74c3c';
    SoundEngine.playSE('roulette_spin');
    count++;
    if (count > 12) {
      clearInterval(timer);
      document.getElementById('btn-cpu-spin').disabled = false;
      applyRouletteResult(Math.random() < 0.5);
    }
  }, 85);
}

function applyRouletteResult(isYouSpade) {
  gameState.spadePlayer = isYouSpade ? 'YOU' : '相手';
  gameState.heartPlayer = isYouSpade ? '相手' : 'YOU';
  gameState.cycle = 1;
  gameState.fieldSuit = '♠';
  gameState.isPlayerParent = isYouSpade;
  gameState.isGameOver = false;

  const suitEl = document.getElementById('roulette-suit');
  suitEl.innerText = isYouSpade ? '♠' : '♥';
  suitEl.style.color = isYouSpade ? '#3498db' : '#e74c3c';
  document.getElementById('roulette-result-text').innerText = isYouSpade ? '♠場：YOUの先親スタート！' : '♠場：相手の先親スタート（あなたは♥後親）';

  if (gameState.isOnline) {
    document.getElementById('btn-online-game-start').style.display = 'inline-block';
  } else {
    setTimeout(initGameSession, 800);
  }
}

function initDeck() {
  const suits = ['♠', '♥', '♦', '♣'];
  gameState.deck = [];
  suits.forEach(suit => {
    for (let v = 2; v <= 14; v++) gameState.deck.push({ suit, val: v, isJoker: false });
  });
  gameState.deck.push({ suit: '', val: 0, isJoker: true });
  for (let i = gameState.deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [gameState.deck[i], gameState.deck[j]] = [gameState.deck[j], gameState.deck[i]];
  }
}

function initGameSession() {
  if (gameState.isGameOver) return;
  clearInterval(turnTimer); clearInterval(resTimer); clearInterval(rematchTimer);
  initDeck();

  gameState.playerHand = []; gameState.cpuHand = [];
  gameState.playerRiver = []; gameState.cpuRiver = [];
  gameState.selectedCardIdx = null; gameState.hasDrawn = false;
  gameState.isPlayerReach = false; gameState.isPlayerReachPending = false;
  gameState.isDoubleReach = false;
  gameState.cpuIsReach = false; gameState.cpuIsDoubleReach = false;
  gameState.turnCount = 0;
  gameState.playerReachTurnIndex = -1; gameState.cpuReachTurnIndex = -1;
  gameState.playerReachTileIndex = null; gameState.cpuReachTileIndex = null;
  gameState.isColdWinTriggered = false;
  gameState.doraCards = []; gameState.uraDoraCards = [];

  const maxCycle = (gameState.mode === 'main' && !gameState.isOnline) ? 4 : 2;
  const doraCount = (gameState.cycle === maxCycle) ? 2 : 1;
  for (let i = 0; i < doraCount; i++) {
    if (gameState.deck.length > 0) gameState.doraCards.push(gameState.deck.pop());
    if (gameState.deck.length > 0) gameState.uraDoraCards.push(gameState.deck.pop());
  }

  if (gameState.isPlayerParent) {
    for (let i = 0; i < 5; i++) gameState.playerHand.push(gameState.deck.pop());
    for (let i = 0; i < 4; i++) gameState.cpuHand.push(gameState.deck.pop());
  } else {
    for (let i = 0; i < 4; i++) gameState.playerHand.push(gameState.deck.pop());
    for (let i = 0; i < 5; i++) gameState.cpuHand.push(gameState.deck.pop());
  }

  if (gameState.streakCount > 0 && gameState.streakCount % 3 === 0) {
    if (gameState.isPlayerParent) gameState.playerScore -= 2;
    else gameState.cpuScore -= 2;
    gameState.kyotaku += 2;
  }

  switchScreen('screen-game');
  resetReachButtonUI();
  updateBoardUI(); renderCpuMiniHand(); renderHands(); renderRivers(); checkPlayerReadyStatus();

  if (gameState.isPlayerParent) {
    document.getElementById('hand-status-msg').innerText = "あなたの親番です。2回タップで打牌または和了できます。";
    document.getElementById('btn-draw').disabled = true;
    startTurnTimerIfNeeded();
  } else {
    document.getElementById('hand-status-msg').innerText = "子スタート（相手の初手待機中）...";
    document.getElementById('btn-draw').disabled = true;
    setTimeout(cpuTurnRoutine, 900);
  }
}

function startTurnTimerIfNeeded() {
  clearInterval(turnTimer);
  const timerLabel = document.getElementById('board-timer-label');
  if (!gameState.isOnline) {
    timerLabel.style.display = 'none';
    return;
  }
  timerLabel.style.display = 'inline';
  turnTimeLeft = 30;
  timerLabel.innerText = "⏱ " + turnTimeLeft + "秒";
  turnTimer = setInterval(() => {
    turnTimeLeft--;
    timerLabel.innerText = "⏱ " + turnTimeLeft + "秒";
    if (turnTimeLeft === 3 || turnTimeLeft === 2 || turnTimeLeft === 1) SoundEngine.playSE('timer_warning_pip');
    else if (turnTimeLeft === 0) SoundEngine.playSE('timer_warning_bone');
    if (turnTimeLeft <= 0) {
      clearInterval(turnTimer);
      if (gameState.playerHand.length === 5) playerDiscard(gameState.playerHand.length - 1);
      else if (gameState.playerHand.length === 4) {
        playerDraw();
        setTimeout(() => { if (gameState.playerHand.length === 5) playerDiscard(4); }, 350);
      }
    }
  }, 1000);
}

function playerDraw() {
  if (gameState.playerHand.length !== 4 || gameState.hasDrawn) return;
  if (gameState.deck.length === 0) { handleDrawGame(); return; }
  clearInterval(turnTimer);
  SoundEngine.playSE('draw_card');
  gameState.playerHand.push(gameState.deck.pop());
  gameState.hasDrawn = true;
  gameState.selectedCardIdx = null;
  document.getElementById('btn-draw').disabled = true;
  document.getElementById('hand-status-msg').innerText = gameState.isPlayerReach
    ? "リーチ中：右端のツモ牌を選択して打牌または和了してください。"
    : "カードを2回タップして打牌するか、和了できます。";
  renderHands(); updateBoardUI(); checkPlayerReadyStatus();
  startTurnTimerIfNeeded();
}

function handleCardClick(idx) {
  const handLen = gameState.playerHand.length;
  if (gameState.isPlayerReach && handLen === 5 && idx !== 4) {
    SoundEngine.playSE('lose_basic');
    document.getElementById('hand-status-msg').innerText = "⚠️ リーチ中は一番右のツモ牌しか捨てられません！";
    return;
  }
  if (gameState.selectedCardIdx === idx) {
    playerDiscard(idx);
  } else {
    SoundEngine.playSE('select_card');
    gameState.selectedCardIdx = idx;
    renderHands();
    checkPlayerReadyStatus();
  }
}

function togglePlayerReach() {
  if (gameState.isOnline && gameState.roomRule === 'damaten') {
    SoundEngine.playSE('lose_basic');
    alert("❌ このダマテンの部屋ではリーチが禁止されています！");
    return;
  }
  if (gameState.isPlayerReach) return;
  const btn = document.getElementById('btn-reach');
  if (gameState.isPlayerReachPending) {
    gameState.isPlayerReachPending = false;
    SoundEngine.playSE('select_card');
    resetReachButtonUI();
    document.getElementById('hand-status-msg').innerText = "リーチ宣言をキャンセルしました。";
    return;
  }
  SoundEngine.playSE('reach_declare');
  gameState.isPlayerReachPending = true;
  btn.style.background = '#e67e22';
  btn.innerText = 'キャンセル';
  document.getElementById('hand-status-msg').innerText = "リーチ宣言中：テンパイを維持する牌を2回タップして打牌してください。";
}

function playerDiscard(idx) {
  if (gameState.playerHand.length !== 5) return;
  clearInterval(turnTimer);

  // リーチ宣言保留中なら、打牌前にテンパイ維持＆リーチ可否を厳密確認
  if (gameState.isPlayerReachPending) {
    const remaining4 = gameState.playerHand.filter((_, i) => i !== idx);
    if (!checkIsTenpai(remaining4, true)) {
      SoundEngine.playSE('lose_basic');
      document.getElementById('hand-status-msg').innerText = "⚠️ その牌を捨てるとテンパイになりません！別の牌を選んでください。";
      gameState.selectedCardIdx = null;
      renderHands();
      startTurnTimerIfNeeded();
      return;
    }
    SoundEngine.playSE('reach_slash');
    // 0巡目（第1打牌前・turnCount === 0）でのリーチ宣言はダブルリーチ確定
    if (gameState.turnCount === 0) {
      gameState.isDoubleReach = true;
    }
    gameState.isPlayerReach = true;
    gameState.isPlayerReachPending = false;
    gameState.playerScore -= 1;
    gameState.kyotaku += 1;
    gameState.playerReachTurnIndex = gameState.turnCount;
    resetReachButtonUI();
    document.getElementById('btn-reach').disabled = true;
    document.getElementById('hand-status-msg').innerText = gameState.isDoubleReach
      ? "【ダブルリーチ成立】一発チャンス中！"
      : "【リーチ成立】一発チャンス中！";
  } else {
    SoundEngine.playSE('discard_card');
    document.getElementById('hand-status-msg').innerText = "相手のターンを待っています...";
  }

  const discarded = gameState.playerHand.splice(idx, 1)[0];
  gameState.playerRiver.push(discarded);
  if (gameState.isPlayerReach && gameState.playerReachTileIndex === null) {
    gameState.playerReachTileIndex = gameState.playerRiver.length - 1;
  }

  gameState.selectedCardIdx = null;
  gameState.hasDrawn = false;
  gameState.turnCount++;

  renderHands(); renderRivers(); updateBoardUI(); checkPlayerReadyStatus();

  if (checkCpuRonOnPlayerDiscard(discarded)) return;
  setTimeout(cpuTurnRoutine, 800);
}

function checkPlayerReadyStatus() {
  let isReady = false;
  let canReach = false;
  const handLen = gameState.playerHand.length;

  // 1. ツモ和了判定（手札5枚）
  if (handLen === 5) {
    const yaku = evaluateHand5(gameState.playerHand, {
      ignoreReachRequirement: false,
      reachActive: gameState.isPlayerReach,
      allowTenchi: true
    });
    if (yaku && (!yaku.requireReach || gameState.isPlayerReach)) {
      isReady = true;
    }
  }

  // 2. ロン和了判定（相手河の最新牌または対象牌に対してフリテンでない＆成立役あり）
  if (!isReady && gameState.cpuRiver.length > 0 && (handLen === 4 || handLen === 5)) {
    const baseHand4 = (handLen === 5 && gameState.selectedCardIdx !== null)
      ? gameState.playerHand.filter((_, idx) => idx !== gameState.selectedCardIdx)
      : (handLen === 4 ? gameState.playerHand : gameState.playerHand.slice(0, 4));
    const lastCpuTile = gameState.cpuRiver[gameState.cpuRiver.length - 1];
    if (baseHand4.length === 4 && !checkPlayerFuritenForRon(baseHand4, lastCpuTile)) {
      const ronYaku = evaluateRonHand(baseHand4, lastCpuTile, gameState.isPlayerReach);
      if (ronYaku && (!ronYaku.requireReach || gameState.isPlayerReach)) {
        isReady = true;
      }
    }
  }

  // 3. リーチ宣言可否判定（手札5枚・未リーチ・ダマテン部屋以外）
  if (handLen === 5 && !gameState.isPlayerReach && !(gameState.isOnline && gameState.roomRule === 'damaten')) {
    for (let i = 0; i < 5; i++) {
      if (checkIsTenpai(gameState.playerHand.filter((_, idx) => idx !== i), true)) {
        canReach = true;
        break;
      }
    }
  }

  const btnWin = document.getElementById('btn-win');
  btnWin.disabled = !isReady;
  btnWin.style.background = isReady ? '#27ae60' : '#555544';
  btnWin.style.color = isReady ? '#fff' : '#888';

  const btnReach = document.getElementById('btn-reach');
  if (canReach && !(gameState.isOnline && gameState.roomRule === 'damaten')) {
    btnReach.disabled = false;
  } else {
    btnReach.disabled = true;
    if (gameState.isPlayerReachPending) {
      gameState.isPlayerReachPending = false;
      resetReachButtonUI();
    }
  }
}

function playerWin() {
  clearInterval(turnTimer);
  const handLen = gameState.playerHand.length;
  const baseHand4 = (handLen === 5 && gameState.selectedCardIdx !== null)
    ? gameState.playerHand.filter((_, idx) => idx !== gameState.selectedCardIdx)
    : (handLen === 4 ? gameState.playerHand : gameState.playerHand.slice(0, 4));

  let isRon = false;
  let winTile = null;
  let fullHand = [];
  let bestYaku = null;

  if (gameState.cpuRiver.length > 0 && baseHand4.length === 4) {
    const lastCpuTile = gameState.cpuRiver[gameState.cpuRiver.length - 1];
    if (!checkPlayerFuritenForRon(baseHand4, lastCpuTile)) {
      const ronEval = evaluateRonHand(baseHand4, lastCpuTile, gameState.isPlayerReach);
      if (ronEval && (!ronEval.requireReach || gameState.isPlayerReach) && (handLen === 4 || gameState.selectedCardIdx !== null)) {
        isRon = true;
        winTile = lastCpuTile;
        fullHand = [...baseHand4, winTile];
        bestYaku = ronEval;
      }
    }
  }

  if (!isRon && handLen === 5) {
    fullHand = [...gameState.playerHand];
    winTile = fullHand[4];
    bestYaku = evaluateHand5(fullHand, {
      ignoreReachRequirement: false,
      reachActive: gameState.isPlayerReach,
      allowTenchi: true
    });
  }

  if (!bestYaku || fullHand.length !== 5) {
    alert("有効な役がありません");
    return;
  }

  const isPlayerIppatsu = checkIsIppatsu('player');
  if (isPlayerIppatsu) {
    SoundEngine.playSE('ippatsu_shout');
    setTimeout(() => playWinFanfareByYaku(bestYaku), 1100);
  } else {
    playWinFanfareByYaku(bestYaku);
  }

  executeRoundEnd(isRon ? 'ロン' : 'ツモ', 'player', bestYaku, fullHand, winTile, isPlayerIppatsu);
}

function playWinFanfareByYaku(yaku) {
  if (yaku.score >= 20 || yaku.jokerType === 'required') {
    if (yaku.score >= 24) SoundEngine.playSE('win_yakuman');
    else SoundEngine.playSE('win_joker');
  } else if (yaku.score >= 12) {
    SoundEngine.playSE('win_mid');
  } else {
    SoundEngine.playSE('win_basic');
  }
}

function cpuThinkAndDiscard() {
  if (gameState.cpuHand.length !== 5) return 0;
  for (let i = 0; i < 5; i++) {
    if (gameState.cpuHand[i].isJoker) continue;
    if (checkIsTenpai(gameState.cpuHand.filter((_, idx) => idx !== i), true)) return i;
  }
  for (let i = 0; i < 5; i++) if (!gameState.cpuHand[i].isJoker) return i;
  return 4;
}

function checkCpuRonOnPlayerDiscard(discarded) {
  if (gameState.cpuHand.length !== 4 || !discarded) return false;
  const yaku = evaluateRonHand(gameState.cpuHand, discarded, gameState.cpuIsReach);
  if (yaku && (!yaku.requireReach || gameState.cpuIsReach)) {
    const isCpuIppatsu = checkIsIppatsu('cpu');
    executeRoundEnd('ロン', 'cpu', yaku, [...gameState.cpuHand, discarded], discarded, isCpuIppatsu);
    return true;
  }
  return false;
}

function cpuTurnRoutine() {
  if (gameState.deck.length === 0) { handleDrawGame(); return; }
  if (gameState.cpuHand.length === 4) {
    SoundEngine.playSE('draw_card');
    gameState.cpuHand.push(gameState.deck.pop());
  }
  renderCpuMiniHand(); updateBoardUI();

  setTimeout(() => {
    const cpuYaku = evaluateHand5(gameState.cpuHand, {
      ignoreReachRequirement: false,
      reachActive: gameState.cpuIsReach,
      allowTenchi: true
    });
    if (cpuYaku && (!cpuYaku.requireReach || gameState.cpuIsReach)) {
      const isCpuIppatsu = checkIsIppatsu('cpu');
      executeRoundEnd('ツモ', 'cpu', cpuYaku, [...gameState.cpuHand], null, isCpuIppatsu);
      return;
    }

    const reachProbability = (gameState.isOnline && gameState.roomRule === 'damaten')
      ? 0.0
      : (gameState.mode === 'beginner' ? 0.2 : (gameState.isOnline && gameState.roomRule === 'shiren' ? 0.8 : 0.45));

    if (!gameState.cpuIsReach && !(gameState.isOnline && gameState.roomRule === 'damaten')) {
      for (let i = 0; i < 5; i++) {
        if (checkIsTenpai(gameState.cpuHand.filter((_, idx) => idx !== i), true)) {
          const allowDouble = (gameState.mode !== 'beginner') || (gameState.turnCount > 0);
          if ((gameState.turnCount === 0 && !allowDouble)) continue;
          if (gameState.mode === 'master' || Math.random() < reachProbability) {
            if (gameState.turnCount === 0) gameState.cpuIsDoubleReach = true;
            gameState.cpuIsReach = true;
            gameState.cpuScore -= 1;
            gameState.kyotaku += 1;
            gameState.cpuReachTurnIndex = gameState.turnCount;
            break;
          }
        }
      }
    }

    const discardedIdx = cpuThinkAndDiscard();
    const discarded = gameState.cpuHand.splice(discardedIdx, 1)[0];
    gameState.cpuRiver.push(discarded);
    if (gameState.cpuIsReach && gameState.cpuReachTileIndex === null) {
      gameState.cpuReachTileIndex = gameState.cpuRiver.length - 1;
      SoundEngine.playSE('reach_slash');
    } else {
      SoundEngine.playSE('discard_card');
    }

    gameState.turnCount++;
    renderCpuMiniHand(); renderRivers(); updateBoardUI(); checkPlayerReadyStatus();

    gameState.playerHand = gameState.playerHand.slice(0, 4);
    gameState.hasDrawn = false;
    const btnDraw = document.getElementById('btn-draw');
    btnDraw.disabled = false;
    btnDraw.style.background = '#f1c40f';
    btnDraw.style.color = '#000';

    if (gameState.mode === 'beginner') {
      const guideBox = document.getElementById('beginner-guide-box');
      guideBox.style.display = 'block';
      guideBox.innerText = getRandomBeginnerAdvice();
    }
    document.getElementById('hand-status-msg').innerText = "あなたのターンです。「ドロー」を押してください。";
    renderHands();
    startTurnTimerIfNeeded();
  }, 900);
}
 function handleDrawGame() {
  const checkTenpai = (h) => h.length === 4
    ? checkIsTenpai(h, true)
    : h.some((_, i) => checkIsTenpai(h.filter((_, idx) => idx !== i), true));
  executeDrawReport(checkTenpai(gameState.playerHand), checkTenpai(gameState.cpuHand));
}

function executeDrawReport(playerTenpai, cpuTenpai) {
  SoundEngine.playSE('lose_basic');
  const parentTenpai = gameState.isPlayerParent ? playerTenpai : cpuTenpai;

  if (parentTenpai) {
    // 親テンパイ維持
  } else {
    gameState.streakCount = 0;
    switchFieldSuit();
  }

  checkMasterChallengeCondition();

  const streakBanner = document.getElementById('res-streak-banner');
  streakBanner.innerHTML = (parentTenpai && gameState.streakCount > 0)
    ? `<span style="color:#f1c40f;">◎ ${gameState.streakCount}連チャン維持中（流局テンパイ）</span>`
    : '';

  document.getElementById('res-title').innerText = "リザルト";
  document.getElementById('res-subtitle').innerText = playerTenpai ? "【 荒牌平局：テンパイ 】" : "【 荒牌平局：ノーテン 】";
  document.getElementById('res-details').innerHTML = `<div>・${parentTenpai ? "親テンパイ（親権継続）" : "親ノーテン（親権流出）"}</div>`;
  document.getElementById('res-total-score-badge').innerText = '【 総合収支 】 平局';
  document.getElementById('res-total-pt').innerText = `👤 YOU: ${gameState.playerScore}pt vs 相手: ${gameState.cpuScore}pt`;
  handleResultScreenDisplay();
}

function executeRoundEnd(winType, winner, yaku, exactHand5, winTile = null, isIppatsu = false) {
  let scoreDelta = yaku.score;
  const bonusDetails = [];
  const fullHand = exactHand5;

  if (fullHand.some(c => c.isJoker) && yaku.score >= 11 && yaku.jokerType !== 'required') {
    scoreDelta = Math.max(1, scoreDelta - 2);
    bonusDetails.push("阿漕なジョーカー (-2pt)");
  }

  if (winner === 'player') {
    if (gameState.isDoubleReach) {
      scoreDelta += 3;
      bonusDetails.push("ダブルリーチ (+3pt)");
    } else if (gameState.isPlayerReach) {
      scoreDelta += 2;
      bonusDetails.push("リーチ (+2pt)");
    }
  } else {
    if (gameState.cpuIsDoubleReach) {
      scoreDelta += 3;
      bonusDetails.push("ダブルリーチ (+3pt)");
    } else if (gameState.cpuIsReach) {
      scoreDelta += 2;
      bonusDetails.push("リーチ (+2pt)");
    }
  }

  if (isIppatsu) {
    scoreDelta += 1;
    bonusDetails.push("一発 (+1pt)");
  }

  if (gameState.deck.length === 0 && winType === 'ツモ') {
    scoreDelta += 1;
    bonusDetails.push("海底 (+1pt)");
  }

  if (gameState.kyotaku > 0) {
    scoreDelta += gameState.kyotaku;
    bonusDetails.push(`供託回収 (+${gameState.kyotaku}pt)`);
  }

  const isWinnerParent = (winner === 'player' && gameState.isPlayerParent) || (winner === 'cpu' && !gameState.isPlayerParent);
  if (isWinnerParent) {
    scoreDelta += 1;
    bonusDetails.push("親権 (+1pt)");
  }

  const mySuit = (winner === 'player')
    ? (gameState.spadePlayer === 'YOU' ? '♠' : '♥')
    : (gameState.spadePlayer === 'YOU' ? '♥' : '♠');

  if (yaku.name && (yaku.name.includes('フラッシュ') || yaku.name.includes('龍'))) {
    if (fullHand.every(c => c.isJoker || c.suit === mySuit)) {
      scoreDelta += 1;
      bonusDetails.push("フラッシュボーナス(自) (+1pt)");
    }
  }

  const activeDoraList = [...gameState.doraCards, ...gameState.uraDoraCards];
  const doraHits = countDoraHits(fullHand, activeDoraList);
  if (doraHits > 0) {
    scoreDelta += doraHits;
    bonusDetails.push(`ドラ加算 (+${doraHits}pt)`);
  }

  const suitDoraHits = countSuitDoraHits(mySuit, activeDoraList);
  if (suitDoraHits > 0) {
    scoreDelta += suitDoraHits;
    bonusDetails.push(`スートドラ加算 (+${suitDoraHits}pt)`);
  }

  gameState.kyotaku = 0;

  if (winner === 'player') {
    gameState.playerScore += scoreDelta;
    gameState.cpuScore -= scoreDelta;
    if (gameState.isPlayerParent) gameState.streakCount++;
    else {
      gameState.streakCount = 0;
      gameState.isPlayerParent = true;
    }
  } else {
    gameState.cpuScore += scoreDelta;
    gameState.playerScore -= scoreDelta;
    if (!gameState.isPlayerParent) gameState.streakCount++;
    else {
      gameState.streakCount = 0;
      switchFieldSuit();
    }
  }

  checkMasterChallengeCondition();

  const streakBanner = document.getElementById('res-streak-banner');
  streakBanner.innerHTML = gameState.streakCount >= 2
    ? `<span style="color:#f1c40f;">🔥 ${gameState.streakCount}連チャン達成中！</span>`
    : '';

  document.getElementById('res-title').innerText = winner === 'player' ? "🎉 YOUの和了！" : "💥 相手の和了";
  document.getElementById('res-subtitle').innerText = `【${winType}】成立役：${yaku.name}`;

  const handContainer = document.getElementById('res-hand-container');
  handContainer.innerHTML = '';
  fullHand.forEach(c => handContainer.appendChild(createCardElement(c, false, true, null)));

  const doraContainer = document.getElementById('res-dora-container');
  doraContainer.innerHTML = '';
  activeDoraList.forEach(d => {
    if (d) doraContainer.appendChild(createCardElement(d, false, true, null));
  });

  document.getElementById('res-details').innerHTML = [
    `<div>・基本役 (${yaku.score}pt)</div>`,
    ...bonusDetails.map(b => `<div>・${b}</div>`)
  ].join('');

  document.getElementById('res-total-score-badge').innerText =
    `【 総合収支 】 ${winner === 'player' ? '+' : '-'}${scoreDelta} pt`;
  document.getElementById('res-total-pt').innerText =
    `👤 YOU: ${gameState.playerScore}pt vs 相手: ${gameState.cpuScore}pt`;

  handleResultScreenDisplay();
}

function switchFieldSuit() {
  const maxCycle = (gameState.mode === 'main' && !gameState.isOnline) ? 4 : 2;
  if (gameState.fieldSuit === '♠') {
    gameState.fieldSuit = '♥';
    gameState.isPlayerParent = (gameState.heartPlayer === 'YOU');
  } else {
    gameState.cycle++;
    if (gameState.cycle > maxCycle) {
      gameState.isGameOver = true;
      return;
    }
    gameState.fieldSuit = '♠';
    gameState.isPlayerParent = (gameState.spadePlayer === 'YOU');
  }
}

function checkMasterChallengeCondition() {
  gameState.isColdWinTriggered = false;
  if (gameState.mode === 'master' && gameState.streakCount >= 10) {
    gameState.isColdWinTriggered = true;
    gameState.isGameOver = true;
  }
}

function handleResultScreenDisplay() {
  const nextBtn = document.getElementById('btn-next-round');
  const rematchBtn = document.getElementById('btn-rematch');
  const maxCycle = (gameState.mode === 'main' && !gameState.isOnline) ? 4 : 2;
  const isAuras = (gameState.cycle > maxCycle);

  if (gameState.mode === 'master' && gameState.streakCount >= 10) {
    SoundEngine.playSE('master_ending_10');
    document.getElementById('res-title').innerText = "👑 マスター制覇！";
    document.getElementById('res-subtitle').innerText = "10連チャン達成おめでとうございます！";
    nextBtn.style.display = 'none';
    rematchBtn.style.display = gameState.isOnline ? 'inline-block' : 'none';
    switchScreen('screen-result');
    startResTimerIfNeeded();
    return;
  }

  if (gameState.isGameOver || isAuras) {
    const isWin = gameState.playerScore > gameState.cpuScore;
    const isDraw = gameState.playerScore === gameState.cpuScore;
    document.getElementById('res-title').innerText = "🏆 最終結果発表";
    document.getElementById('res-subtitle').innerText = isDraw ? "引き分け" : (isWin ? "🎉 YOUの勝利！" : "💀 相手の勝利...");
    nextBtn.style.display = 'none';
    rematchBtn.style.display = gameState.isOnline ? 'inline-block' : 'none';
  } else {
    nextBtn.style.display = 'inline-block';
    rematchBtn.style.display = 'none';
  }

  switchScreen('screen-result');
  startResTimerIfNeeded();
}

function startResTimerIfNeeded() {
  clearInterval(resTimer);
  const badge = document.getElementById('res-timer-badge');
  if (!gameState.isOnline) {
    badge.style.display = 'none';
    return;
  }
  badge.style.display = 'block';
  resTimeLeft = 30;
  badge.innerText = `⏱ 次の操作まで: ${resTimeLeft}秒`;
  resTimer = setInterval(() => {
    resTimeLeft--;
    badge.innerText = `⏱ 次の操作まで: ${resTimeLeft}秒`;
    if (resTimeLeft <= 3 && resTimeLeft > 0) SoundEngine.playSE('timer_warning_pip');
    else if (resTimeLeft === 0) SoundEngine.playSE('timer_warning_bone');
    if (resTimeLeft <= 0) {
      clearInterval(resTimer);
      if (document.getElementById('btn-next-round').style.display !== 'none') handleResultNextAction();
      else showTitle();
    }
  }, 1000);
}

function handleResultNextAction() {
  clearInterval(resTimer); clearInterval(rematchTimer);
  initGameSession();
}

function requestRematch() {
  if (!gameState.isOnline) return;
  clearInterval(resTimer); clearInterval(rematchTimer);
  const msgEl = document.getElementById('rematch-status-msg');
  msgEl.innerText = "🔄 再戦準備中...";
  setTimeout(() => {
    msgEl.innerText = "";
    gameState.playerScore = 30; gameState.cpuScore = 30;
    gameState.streakCount = 0; gameState.kyotaku = 0;
    gameState.cycle = 1; gameState.isGameOver = false;
    switchScreen('screen-roulette');
    spinCpuRoulette();
  }, 900);
}

function formatVal(val) {
  if (val === 14) return 'A';
  if (val === 13) return 'K';
  if (val === 12) return 'Q';
  if (val === 11) return 'J';
  return String(val);
}

function createCardElement(card, isMini = false, isRiver = false, clickIdx = null, isReachTile = false) {
  const el = document.createElement('div');
  el.className = 'card-tile';
  if (card.isJoker) {
    el.classList.add('red');
    el.style.width = isMini ? '18px' : (isRiver ? '26px' : '46px');
    el.style.height = isMini ? '26px' : (isRiver ? '34px' : '64px');
    el.style.fontSize = isMini ? '0.55rem' : (isRiver ? '0.62rem' : '0.75rem');
    el.innerHTML = `<span>JOKER</span><span>★</span>`;
  } else {
    if (card.suit === '♥' || card.suit === '♦') el.classList.add('red');
    el.style.width = isMini ? '18px' : (isRiver ? '26px' : '46px');
    el.style.height = isMini ? '26px' : (isRiver ? '34px' : '64px');
    el.style.fontSize = isMini ? '0.6rem' : (isRiver ? '0.68rem' : '0.85rem');
    el.innerHTML = `<span>${formatVal(card.val)}</span><span>${card.suit}</span>`;
  }
  if (isReachTile) el.classList.add('reach-tile');
  if (clickIdx !== null) {
    if (gameState.selectedCardIdx === clickIdx) el.classList.add('selected');
    el.style.cursor = 'pointer';
    el.onclick = () => handleCardClick(clickIdx);
  }
  return el;
}

function renderHands() {
  const container = document.getElementById('player-hand-container');
  container.innerHTML = '';
  gameState.playerHand.forEach((card, idx) => {
    container.appendChild(createCardElement(card, false, false, idx, false));
  });
}

function renderCpuMiniHand() {
  const container = document.getElementById('cpu-mini-hand');
  container.innerHTML = '';
  for (let i = 0; i < gameState.cpuHand.length; i++) {
    const back = document.createElement('div');
    back.style.width = '14px'; back.style.height = '20px';
    back.style.background = '#c0392b'; back.style.border = '1px solid #fff';
    back.style.borderRadius = '2px';
    container.appendChild(back);
  }
}

function renderRivers() {
  const pRiver = document.getElementById('player-river-scroll');
  pRiver.innerHTML = '';
  if (gameState.playerRiver.length === 0) {
    pRiver.innerHTML = '<span style="font-size:0.65rem; color:#666;">（なし）</span>';
  } else {
    gameState.playerRiver.forEach((card, idx) => {
      pRiver.appendChild(createCardElement(card, false, true, null, idx === gameState.playerReachTileIndex));
    });
    pRiver.scrollLeft = pRiver.scrollWidth;
  }

  const cRiver = document.getElementById('cpu-river-scroll');
  cRiver.innerHTML = '';
  if (gameState.cpuRiver.length === 0) {
    cRiver.innerHTML = '<span style="font-size:0.65rem; color:#666;">（なし）</span>';
  } else {
    gameState.cpuRiver.forEach((card, idx) => {
      cRiver.appendChild(createCardElement(card, false, true, null, idx === gameState.cpuReachTileIndex));
    });
    cRiver.scrollLeft = cRiver.scrollWidth;
  }
}

function updateBoardUI() {
  document.getElementById('board-cycle-label').innerText = `第${gameState.cycle}サイクル ${gameState.fieldSuit}場`;
  document.getElementById('board-kyotaku').innerText = `${gameState.kyotaku}pt`;
  document.getElementById('board-deck-count').innerText = String(gameState.deck.length);
  document.getElementById('board-streak-label').innerText = `(${gameState.streakCount}連チャン)`;
  document.getElementById('board-score-label').innerText = `YOU: ${gameState.playerScore}pt / 相手: ${gameState.cpuScore}pt`;
  document.getElementById('player-role-badge').innerText = gameState.isPlayerParent ? '[親]' : '[子]';
  document.getElementById('player-reach-badge').innerText = gameState.isPlayerReach
    ? (gameState.isDoubleReach ? '【Wリーチ】' : '【リーチ】')
    : '';
  document.getElementById('cpu-reach-badge').innerText = gameState.cpuIsReach
    ? (gameState.cpuIsDoubleReach ? '【Wリーチ】' : '【リーチ】')
    : '';

  const doraBox = document.getElementById('board-dora-cards');
  doraBox.innerHTML = '';
  gameState.doraCards.forEach(d => doraBox.appendChild(createCardElement(d, true, false, null)));
}

function resetReachButtonUI() {
  const btn = document.getElementById('btn-reach');
  btn.style.background = '#f1c40f';
  btn.style.color = '#000';
  btn.innerText = 'リーチ';
}

let currentRuleCategory = 1;
function openRuleModal() {
  document.getElementById('rule-modal').style.display = 'flex';
  filterYakuCategory(currentRuleCategory);
}
function closeRuleModal() {
  document.getElementById('rule-modal').style.display = 'none';
}
function filterYakuCategory(catId) {
  currentRuleCategory = catId;
  const filtered = YAKU_REGISTRY.filter(y => y.catId === catId);
  const bar = document.getElementById('rule-menu-bar');
  bar.innerHTML = '';
  filtered.forEach((yaku, idx) => {
    const originalIdx = YAKU_REGISTRY.indexOf(yaku);
    const btn = document.createElement('button');
    btn.className = 'yaku-tab-btn ' + (idx === 0 ? 'active' : '');
    btn.innerText = `${yaku.name} (${yaku.catId === 1 ? '加点' : yaku.score + '点'})`;
    btn.onclick = () => {
      SoundEngine.playSE('select_card');
      bar.querySelectorAll('.yaku-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectRuleYaku(originalIdx);
    };
    bar.appendChild(btn);
  });
  if (filtered.length > 0) selectRuleYaku(YAKU_REGISTRY.indexOf(filtered[0]));
}
function selectRuleYaku(idx) {
  const yaku = YAKU_REGISTRY[idx];
  document.getElementById('rule-cat-badge').className = 'yaku-cat-badge ' + yaku.catClass;
  document.getElementById('rule-cat-badge').innerText = yaku.catName;
  document.getElementById('rule-detail-title').innerText = `${yaku.name} (${yaku.catId === 1 ? '加点役' : yaku.score + '点'})`;
  document.getElementById('rule-detail-desc').innerHTML = `<div style="color:#f1c40f; font-weight:bold; margin-bottom:4px;">${yaku.catHeader}</div>${yaku.desc}`;
  const sampleWrap = document.getElementById('rule-sample-title-wrap');
  const sampleBox = document.getElementById('rule-sample-cards');
  if (yaku.sample) {
    sampleWrap.style.display = 'block';
    sampleBox.style.display = 'flex';
    sampleBox.innerHTML = '';
    yaku.sample.forEach(c => sampleBox.appendChild(createCardElement(c, false, true, null)));
  } else {
    sampleWrap.style.display = 'none';
    sampleBox.style.display = 'none';
  }
}
</script>
